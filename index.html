<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080504">
<title>Azad Ki Shadi Mubarak — Wedding Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#c9a96e;
  --light-gold:#ffe8ae;
  --pink:#f4a1c0;
  --deep:#080504;
}
*{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  background:#080504;color:#fff;
  font-family:Poppins,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.screen{
  position:relative;
  min-height:100vh;min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  padding:52px 18px;
  overflow:hidden;
  /* Lightweight CSS-only cinematic background (no huge base64) */
  background:
    radial-gradient(circle at 20% 15%, rgba(201,169,110,.18), transparent 45%),
    radial-gradient(circle at 80% 85%, rgba(244,161,192,.14), transparent 45%),
    radial-gradient(circle at 50% 50%, rgba(255,232,174,.06), transparent 60%),
    linear-gradient(160deg, #0b0705 0%, #080504 45%, #0d0806 100%);
}
/* Soft vignette */
.screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.75) 100%);
}
/* Subtle floating sparkles */
.screen::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 12% 22%, #ffe8ae, transparent 60%),
    radial-gradient(2px 2px at 78% 18%, #f4a1c0, transparent 60%),
    radial-gradient(2px 2px at 28% 82%, #c9a96e, transparent 60%),
    radial-gradient(2px 2px at 88% 72%, #ffe8ae, transparent 60%),
    radial-gradient(1.5px 1.5px at 55% 45%, #fff, transparent 60%),
    radial-gradient(1.5px 1.5px at 40% 10%, #ffe8ae, transparent 60%);
  opacity:.55;
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{0%{opacity:.35}100%{opacity:.8}}

.content{width:100%;max-width:1400px;position:relative;z-index:1}

/* --- CORNER FRAME --- */
.corner{position:absolute;width:78px;height:78px;opacity:.85;pointer-events:none;z-index:2}
.corner::before,.corner::after{
  content:"";position:absolute;background:var(--gold);
  box-shadow:0 0 10px rgba(201,169,110,.55);
}
.corner::before{height:1px;width:100%}
.corner::after{height:100%;width:1px}
.tl{top:16px;left:16px}
.tr{top:16px;right:16px;transform:scaleX(-1)}
.bl{bottom:16px;left:16px;transform:scaleY(-1)}
.br{bottom:16px;right:16px;transform:scale(-1)}

/* --- TEXT --- */
.ornament{
  color:var(--gold);font-size:26px;letter-spacing:10px;
  text-shadow:0 0 18px rgba(255,210,120,.5);
  margin-bottom:10px;
}
.subtitle{
  font-size:clamp(10px,1.2vw,15px);
  letter-spacing:clamp(4px,1vw,8px);
  color:var(--light-gold);
  margin:0 0 12px;
}
h1{
  font-family:"Great Vibes",cursive;
  font-size:clamp(42px,9vw,104px);
  font-weight:400;line-height:1.15;
  color:var(--pink);
  margin:0 0 8px;
  text-shadow:0 0 8px rgba(255,150,190,.55), 0 0 24px rgba(255,100,160,.35);
}
.divider{
  display:flex;align-items:center;gap:16px;
  width:min(440px,75%);margin:10px auto 26px;
}
.divider span{height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.divider span:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.divider b{color:var(--gold);font-size:18px}

.label{
  font-size:clamp(10px,1.2vw,14px);
  letter-spacing:clamp(3px,.9vw,6px);
  color:#fff2d2;margin:0 0 18px;
}

/* --- COUNTDOWN GRID --- */
.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:clamp(8px,1.6vw,22px);
  max-width:720px;
  margin:0 auto 22px;
}
.unit{
  background:rgba(12,7,5,.55);
  border:1px solid rgba(201,169,110,.5);
  border-radius:10px;
  padding:clamp(12px,2vw,22px) clamp(4px,1vw,12px);
  box-shadow:inset 0 0 22px rgba(201,169,110,.08), 0 0 20px rgba(201,169,110,.08);
  backdrop-filter:blur(2px);
}
.unit .num{
  font-size:clamp(26px,6.5vw,68px);
  font-weight:600;
  line-height:1;
  color:var(--light-gold);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 10px rgba(255,196,82,.4), 0 0 26px rgba(255,196,82,.25);
}
.unit .cap{
  margin-top:8px;
  font-size:clamp(8px,1.1vw,12px);
  letter-spacing:clamp(2px,.7vw,5px);
  color:var(--gold);
  text-transform:uppercase;
}

.seconds-line{
  color:#f8e6bd;
  font-size:clamp(11px,1.2vw,14px);
  letter-spacing:3px;
  margin:0 0 24px;
  opacity:.9;
}

/* --- DATE + DETAILS --- */
.date-box{
  display:inline-block;
  border:1px solid rgba(201,169,110,.75);
  background:rgba(12,7,5,.66);
  padding:14px 32px;
  box-shadow:inset 0 0 20px rgba(201,169,110,.06), 0 0 24px rgba(201,169,110,.10);
  margin-bottom:22px;
}
.date-text{
  color:#fff0cb;
  font-size:clamp(13px,1.7vw,19px);
  font-weight:500;
  letter-spacing:clamp(2px,.5vw,5px);
  margin:0;white-space:nowrap;
}

/* Wedding detail rows */
.details{
  display:flex;flex-wrap:wrap;
  justify-content:center;gap:14px 30px;
  max-width:760px;margin:0 auto 20px;
  color:#f0dcb8;
  font-size:clamp(11px,1.3vw,15px);
  letter-spacing:1px;
}
.details .item{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;
  border:1px solid rgba(201,169,110,.28);
  border-radius:40px;
  background:rgba(12,7,5,.4);
}
.details .item i{color:var(--gold);font-style:normal}

.wish{
  color:#ffe6c5;
  font-family:"Great Vibes",cursive;
  font-size:clamp(22px,3vw,34px);
  margin:22px 0 0;
  text-shadow:0 0 12px rgba(255,190,130,.4);
}

/* --- MUSIC BUTTON + TIMER --- */
.music-button{
  position:fixed;z-index:6;right:18px;bottom:18px;
  display:flex;align-items:center;gap:9px;
  border:1px solid rgba(201,169,110,.8);
  border-radius:50px;
  padding:10px 16px;
  background:rgba(12,7,5,.9);
  color:var(--light-gold);
  font:12px Poppins,Arial,sans-serif;
  cursor:pointer;
  box-shadow:0 0 18px rgba(201,169,110,.25);
  transition:transform .15s ease, box-shadow .2s ease;
}
.music-button:active{transform:scale(.96)}
.music-timer{
  font-variant-numeric:tabular-nums;
  color:var(--gold);
  border-left:1px solid rgba(201,169,110,.4);
  padding-left:9px;
  margin-left:2px;
  min-width:36px;
  text-align:right;
}

/* Responsive */
@media(max-width:600px){
  .screen{padding:44px 12px}
  .corner{width:46px;height:46px}
  .tl{top:10px;left:10px}.tr{top:10px;right:10px}
  .bl{bottom:10px;left:10px}.br{bottom:10px;right:10px}
  .countdown{grid-template-columns:repeat(4,1fr);gap:8px;max-width:100%}
  .unit{border-radius:8px}
  .details{gap:10px 14px}
  .details .item{padding:7px 12px;font-size:11px}
  .music-button{right:10px;bottom:10px;padding:9px 13px;font-size:11px}
}
@media(max-height:680px) and (min-width:601px){
  .screen{padding:24px 14px}
  .ornament{margin-bottom:6px}
  h1{font-size:clamp(38px,6.5vw,70px)}
  .divider{margin:6px auto 14px}
  .countdown{margin-bottom:14px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="screen">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <section class="content">
    <div class="ornament">✧ ❦ ✧</div>
    <p class="subtitle">A CELEBRATION OF LOVE</p>
    <h1>Azad Ki Shadi Mubarak</h1>
    <div class="divider"><span></span><b>❦</b><span></span></div>

    <p class="label" id="countdownLabel">WEDDING COUNTDOWN</p>

    <div class="countdown">
      <div class="unit"><div class="num" id="days">--</div><div class="cap">Days</div></div>
      <div class="unit"><div class="num" id="hours">--</div><div class="cap">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">--</div><div class="cap">Minutes</div></div>
      <div class="unit"><div class="num" id="secondsNum">--</div><div class="cap">Seconds</div></div>
    </div>

    <p class="seconds-line" id="seconds">PLEASE WAIT</p>

    <div class="date-box">
      <p class="date-text">19 OCTOBER 2026</p>
    </div>

    <div class="details">
      <div class="item"><i>❦</i> Nikah Ceremony — 11:00 AM</div>
      <div class="item"><i>✦</i> Walima Reception — 7:00 PM</div>
      <div class="item"><i>♥</i> Azad &amp; Beloved</div>
    </div>

    <p class="wish">Two Hearts, One Beautiful Journey</p>
  </section>

  <button class="music-button" id="musicButton" type="button">
    <span id="musicIcon">♫</span>
    <span id="musicLabel">Play Music</span>
    <span class="music-timer" id="musicTimer">0:00</span>
  </button>
</main>

<audio id="weddingMusic" loop preload="none" playsinline>
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_fa5e7f6d6d.mp3" type="audio/mpeg">
</audio>

<script>
(function(){
  "use strict";

  /* ---------- COUNTDOWN ---------- */
  var wedding = new Date(2026, 9, 19, 0, 0, 0); // 19 Oct 2026, local midnight
  var daysEl    = document.getElementById('days');
  var hoursEl   = document.getElementById('hours');
  var minutesEl = document.getElementById('minutes');
  var secNumEl  = document.getElementById('secondsNum');
  var secLineEl = document.getElementById('seconds');
  var labelEl   = document.getElementById('countdownLabel');

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function updateCountdown(){
    var now  = new Date();
    var diff = wedding.getTime() - now.getTime();

    if (diff <= 0){
      daysEl.textContent = hoursEl.textContent = minutesEl.textContent = secNumEl.textContent = '0';
      secLineEl.textContent = '00 SECONDS';
      labelEl.textContent = 'THE BIG DAY IS HERE';
      return;
    }

    var totalSec = Math.floor(diff / 1000);
    var d = Math.floor(totalSec / 86400);
    var h = Math.floor((totalSec % 86400) / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;

    daysEl.textContent    = String(d);
    hoursEl.textContent   = pad(h);
    minutesEl.textContent = pad(m);
    secNumEl.textContent  = pad(s);
    secLineEl.textContent = d + ' DAYS, ' + h + ' HRS, ' + m + ' MIN, ' + s + ' SEC REMAINING';
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  /* ---------- MUSIC + TIMER ---------- */
  var music     = document.getElementById('weddingMusic');
  var button    = document.getElementById('musicButton');
  var icon      = document.getElementById('musicIcon');
  var label     = document.getElementById('musicLabel');
  var timerEl   = document.getElementById('musicTimer');
  var timerInt  = null;

  function fmt(t){
    t = Math.floor(t || 0);
    var m = Math.floor(t / 60);
    var s = t % 60;
    return m + ':' + pad(s);
  }

  function syncButton(){
    var playing = !music.paused && !music.ended;
    icon.textContent  = playing ? 'Ⅱ' : '♫';
    label.textContent = playing ? 'Pause Music' : 'Play Music';
    if (playing){
      if (!timerInt) timerInt = setInterval(function(){ timerEl.textContent = fmt(music.currentTime); }, 500);
    } else {
      clearInterval(timerInt);
      timerInt = null;
    }
  }

  button.addEventListener('click', function(){
    if (music.paused){
      var p = music.play();
      if (p && p.catch){
        p.catch(function(){ label.textContent = 'Audio unavailable'; });
      }
    } else {
      music.pause();
    }
  });

  music.addEventListener('play',  syncButton);
  music.addEventListener('pause', syncButton);
  music.addEventListener('timeupdate', function(){ timerEl.textContent = fmt(music.currentTime); });
  music.addEventListener('ended', syncButton);
  music.volume = 0.65;
  syncButton();

  /* Try autoplay silently (most mobile browsers will block until tap) */
  var auto = music.play();
  if (auto && auto.catch) auto.catch(function(){ /* blocked — user must tap */ });
})();
</script>
</body>
</html>
