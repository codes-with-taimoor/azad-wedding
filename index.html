
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080504">
<title>Azad Ki Shadi Mubarak | Wedding Countdown</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --gold: #c9a96e;
    --light-gold: #ffe8ae;
    --pink: #f4a1c0;
    --black: #080504;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: 'Poppins', sans-serif;
    background: var(--black);
    color: white;
    overflow-x: hidden;
}

.wedding-screen {
    position: relative;
    isolation: isolate;
    min-height: 100vh;
    min-height: 100svh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 50px 20px;
    background-color: var(--black);
    overflow: hidden;
}

.wedding-screen::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -2;
    background-image: url("bg.jpg");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    filter: brightness(0.5);
    transform: scale(1.02);
}

.wedding-screen::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
        radial-gradient(ellipse at center,
            rgba(30, 13, 8, 0.10) 0%,
            rgba(8, 4, 3, 0.45) 60%,
            rgba(0, 0, 0, 0.82) 100%),
        linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.30),
            rgba(0, 0, 0, 0.45)
        );
}

.corner {
    position: absolute;
    width: 100px;
    height: 100px;
    pointer-events: none;
    opacity: 0.8;
}

.corner::before,
.corner::after {
    content: "";
    position: absolute;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(201, 169, 110, 0.4);
}

.corner::before {
    width: 100%;
    height: 1px;
}

.corner::after {
    width: 1px;
    height: 100%;
}

.top-left {
    top: 22px;
    left: 22px;
}

.top-right {
    top: 22px;
    right: 22px;
    transform: scaleX(-1);
}

.bottom-left {
    bottom: 22px;
    left: 22px;
    transform: scaleY(-1);
}

.bottom-right {
    bottom: 22px;
    right: 22px;
    transform: scale(-1);
}

.content {
    width: 100%;
    max-width: 1400px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.ornament {
    color: var(--gold);
    font-size: clamp(23px, 3vw, 36px);
    letter-spacing: 12px;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(255, 210, 120, 0.65);
    animation: shimmer 3s infinite alternate;
}

.subtitle {
    font-size: clamp(11px, 1.3vw, 17px);
    letter-spacing: clamp(4px, 1vw, 9px);
    font-weight: 400;
    color: var(--light-gold);
    text-transform: uppercase;
    margin-bottom: 18px;
    text-shadow: 0 0 15px rgba(255, 211, 139, 0.4);
}

h1 {
    font-family: 'Great Vibes', cursive;
    color: var(--pink);
    font-size: clamp(50px, 9vw, 112px);
    font-weight: 400;
    line-height: 1.2;
    margin-bottom: 12px;
    padding: 0 10px;
    text-shadow:
        0 0 8px rgba(255, 150, 190, 0.7),
        0 0 22px rgba(255, 100, 160, 0.4),
        0 3px 5px rgba(0, 0, 0, 0.8);
}

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: min(440px, 75%);
    margin: 12px 0 34px;
}

.divider span {
    height: 1px;
    flex: 1;
    background: linear-gradient(90deg, transparent, var(--gold));
}

.divider span:last-child {
    background: linear-gradient(90deg, var(--gold), transparent);
}

.divider i {
    color: var(--gold);
    font-size: 17px;
    font-style: normal;
    text-shadow: 0 0 12px var(--gold);
}

.countdown-label {
    color: #fff2d2;
    font-size: clamp(10px, 1.2vw, 15px);
    letter-spacing: clamp(3px, 0.9vw, 7px);
    margin-bottom: 12px;
    font-weight: 400;
}

.minutes {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(64px, 13vw, 155px);
    font-weight: 600;
    letter-spacing: clamp(0px, 0.8vw, 7px);
    line-height: 1.12;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--light-gold);
    background: linear-gradient(
        180deg,
        #fff8dd 0%,
        #f9dfa0 30%,
        #d7ad5f 65%,
        #fff0bc 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 196, 82, 0.38));
    animation: goldGlow 3s ease-in-out infinite alternate;
}

.minutes-caption {
    color: var(--gold);
    font-size: clamp(11px, 1.35vw, 16px);
    letter-spacing: clamp(4px, 1vw, 9px);
    font-weight: 500;
    margin-top: 14px;
    margin-bottom: 32px;
}

.date-box {
    border: 1px solid rgba(201, 169, 110, 0.75);
    background: rgba(12, 7, 5, 0.48);
    padding: 17px 36px;
    min-width: 250px;
    box-shadow:
        inset 0 0 20px rgba(201, 169, 110, 0.06),
        0 0 25px rgba(201, 169, 110, 0.08);
    position: relative;
}

.date-box::before,
.date-box::after {
    content: "✦";
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 13px;
}

.date-box::before {
    left: 12px;
}

.date-box::after {
    right: 12px;
}

.date-text {
    color: #fff0cb;
    font-size: clamp(13px, 1.7vw, 20px);
    font-weight: 500;
    letter-spacing: clamp(2px, 0.5vw, 5px);
    white-space: nowrap;
}

.wish {
    color: rgba(255, 230, 190, 0.9);
    font-family: 'Great Vibes', cursive;
    font-size: clamp(23px, 3vw, 34px);
    margin-top: 28px;
    text-shadow: 0 0 12px rgba(255, 190, 130, 0.4);
}

.music-button {
    position: fixed;
    z-index: 5;
    right: 24px;
    bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border: 1px solid rgba(201, 169, 110, 0.8);
    border-radius: 50px;
    padding: 11px 18px;
    background: rgba(12, 7, 5, 0.8);
    color: var(--light-gold);
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.3s ease;
}

.music-button:hover {
    background: rgba(201, 169, 110, 0.2);
    box-shadow: 0 0 18px rgba(201, 169, 110, 0.25);
}

.music-icon {
    font-size: 16px;
}

.music-note {
    position: fixed;
    z-index: 0;
    color: rgba(255, 220, 155, 0.6);
    pointer-events: none;
    animation: floatUp linear infinite;
}

@keyframes goldGlow {
    from {
        filter: drop-shadow(0 0 7px rgba(255, 196, 82, 0.25));
    }
    to {
        filter: drop-shadow(0 0 19px rgba(255, 196, 82, 0.58));
    }
}

@keyframes shimmer {
    from { opacity: 0.65; }
    to { opacity: 1; }
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% { opacity: 0.65; }
    85% { opacity: 0.4; }
    100% {
        transform: translateY(-100vh) rotate(30deg);
        opacity: 0;
    }
}

@media (min-width: 1600px) {
    .content {
        max-width: 1600px;
    }

    h1 {
        font-size: 135px;
    }

    .minutes {
        font-size: 180px;
    }
}

@media (max-width: 600px) {
    .wedding-screen {
        padding: 48px 14px;
    }

    .corner {
        width: 55px;
        height: 55px;
    }

    .top-left { top: 12px; left: 12px; }
    .top-right { top: 12px; right: 12px; }
    .bottom-left { bottom: 12px; left: 12px; }
    .bottom-right { bottom: 12px; right: 12px; }

    .ornament {
        margin-bottom: 12px;
    }

    h1 {
        font-size: clamp(46px, 12vw, 72px);
        margin-bottom: 9px;
    }

    .divider {
        margin: 10px 0 30px;
    }

    .minutes {
        font-size: clamp(53px, 15vw, 85px);
        letter-spacing: 0;
    }

    .minutes-caption {
        margin-top: 12px;
        margin-bottom: 26px;
    }

    .date-box {
        padding: 15px 27px;
        min-width: 0;
    }

    .wish {
        margin-top: 23px;
    }

    .music-button {
        right: 12px;
        bottom: 12px;
        padding: 10px 14px;
    }
}

@media (max-height: 650px) and (min-width: 601px) {
    .wedding-screen {
        padding: 24px 15px;
    }

    .ornament {
        margin-bottom: 5px;
    }

    h1 {
        font-size: clamp(45px, 7vw, 75px);
    }

    .divider {
        margin: 5px 0 16px;
    }

    .minutes {
        font-size: clamp(65px, 11vw, 105px);
    }

    .minutes-caption {
        margin-top: 8px;
        margin-bottom: 18px;
    }

    .wish {
        margin-top: 15px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<main class="wedding-screen">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="content">

        <div class="ornament">✧ ❦ ✧</div>

        <p class="subtitle">A Celebration of Love</p>

        <h1>Azad Ki Shadi Mubarak</h1>

        <div class="divider">
            <span></span>
            <i>❦</i>
            <span></span>
        </div>

        <p class="countdown-label">WEDDING COUNTDOWN</p>

        <div id="minutes" class="minutes" aria-live="off">14,195</div>

        <p class="minutes-caption">MINUTES REMAINING</p>

        <div class="date-box">
            <p class="date-text">19 OCTOBER 2026</p>
        </div>

        <p class="wish">Two Hearts, One Beautiful Journey</p>

    </div>

    <button
        class="music-button"
        id="musicButton"
        type="button"
        aria-label="Play background music"
    >
        <span class="music-icon" id="musicIcon">♫</span>
        <span id="musicLabel">Play Music</span>
    </button>

</main>

<audio
    id="weddingMusic"
    loop
    preload="auto"
    autoplay
    playsinline
>
    <source
        src="https://cdn.pixabay.com/audio/2022/10/30/audio_fa5e7f6d6d.mp3"
        type="audio/mpeg"
    >
</audio>

<script>
"use strict";

// Wedding date: 19 October 2026, local time at midnight.
const wedding = new Date(2026, 9, 19);

const minutesDisplay = document.getElementById("minutes");
const music = document.getElementById("weddingMusic");
const musicButton = document.getElementById("musicButton");
const musicIcon = document.getElementById("musicIcon");
const musicLabel = document.getElementById("musicLabel");

const numberFormat = new Intl.NumberFormat("en-US");

function updateCountdown() {
    const now = new Date();
    const difference = wedding.getTime() - now.getTime();

    if (difference <= 0) {
        minutesDisplay.textContent = "0";
        document.querySelector(".countdown-label").textContent =
            "THE BIG DAY IS HERE";
        document.querySelector(".minutes-caption").textContent =
            "HAPPY WEDDING DAY";
        return;
    }

    // Calculate the remaining minutes, updating every second.
    const remainingMinutes = Math.floor(
        difference / (1000 * 60)
    );

    minutesDisplay.textContent = numberFormat.format(remainingMinutes);
}

// Update immediately and then every second.
updateCountdown();
setInterval(updateCountdown, 1000);

// Keep the music control synchronized with actual playback.
function updateMusicButton() {
    if (music.paused) {
        musicIcon.textContent = "♫";
        musicLabel.textContent = "Play Music";
        musicButton.setAttribute("aria-label", "Play background music");
    } else {
        musicIcon.textContent = "Ⅱ";
        musicLabel.textContent = "Pause Music";
        musicButton.setAttribute("aria-label", "Pause background music");
    }
}

musicButton.addEventListener("click", async function () {
    if (music.paused) {
        try {
            await music.play();
        } catch (error) {
            musicLabel.textContent = "Tap to Retry";
        }
    } else {
        music.pause();
    }

    updateMusicButton();
});

music.addEventListener("play", updateMusicButton);
music.addEventListener("pause", updateMusicButton);
music.addEventListener("ended", updateMusicButton);

// Attempt autoplay; browsers may require a user tap first.
music.volume = 0.65;

music.play().then(function () {
    updateMusicButton();
}).catch(function () {
    updateMusicButton();
});

// Decorative floating golden particles.
function createParticle() {
    const particle = document.createElement("span");
    particle.className = "music-note";
    particle.textContent = Math.random() > 0.5 ? "✦" : "·";

    particle.style.left = Math.random() * 100 + "vw";
    particle.style.bottom = "-20px";
    particle.style.fontSize = (8 + Math.random() * 13) + "px";
    particle.style.animationDuration = (8 + Math.random() * 10) + "s";

    document.body.appendChild(particle);

    particle.addEventListener("animationend", function () {
        particle.remove();
    });
}

if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setInterval(createParticle, 1000);
}
</script>

</body>
</html>
