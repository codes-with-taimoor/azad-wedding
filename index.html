<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100805">
<title>Azad Ki Shadi Mubarak</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #e5c27e;
  --pink: #ffc0d7;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  min-height: 100%;
  background: #100805;
  color: white;
  font-family: Poppins, Arial, sans-serif;
}

.screen {
  position: relative;
  isolation: isolate;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 45px 14px 100px;
  overflow: hidden;
  background: #100805;
}

/* BACKGROUND IMAGE */
.bg-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
  z-index: -2;
}

/* IMAGE DARKNESS */
.screen::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    rgba(8,4,3,.42),
    rgba(8,4,3,.35) 40%,
    rgba(8,4,3,.70)
  );
}

/* PETALS STAY BEHIND THE TEXT */
#petalsCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.content {
  width: 100%;
  max-width: 1100px;
  position: relative;
  z-index: 2;
}

.ornament {
  color: var(--gold);
  font-size: 25px;
  letter-spacing: 9px;
  text-shadow: 0 0 20px #e5c27e;
}

.subtitle {
  color: #ffe8ae;
  letter-spacing: 4px;
  font-size: 12px;
  margin: 8px 0;
  text-shadow: 0 2px 8px #000;
}

h1 {
  font-family: "Great Vibes", cursive;
  color: var(--pink);
  font-weight: 400;
  font-size: clamp(43px, 8vw, 100px);
  line-height: 1.2;
  margin: 5px 0;
  text-shadow: 0 0 15px #a82e61, 0 3px 12px #000;
}

.divider {
  display: flex;
  align-items: center;
  gap: 15px;
  max-width: 400px;
  width: 75%;
  margin: 12px auto 24px;
  color: var(--gold);
}

.divider span {
  height: 1px;
  flex: 1;
  background: var(--gold);
}

.label {
  color: #fff1d2;
  letter-spacing: 4px;
  font-size: 12px;
  text-shadow: 0 2px 8px #000;
}

.minutes-total {
  color: #ffe8ae;
  font-size: clamp(44px, 11vw, 130px);
  font-weight: 600;
  line-height: 1.15;
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 18px #bc8837, 0 3px 15px #000;
}

.minutes-caption {
  color: var(--gold);
  letter-spacing: 3px;
  font-size: 12px;
}

.seconds-line {
  color: #fff0d0;
  font-size: 12px;
  letter-spacing: 3px;
}

.countdown {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
  width: 100%;
  max-width: 700px;
  margin: 25px auto;
}

.unit {
  background: rgba(20, 9, 8, .78);
  border: 1px solid rgba(229,194,126,.85);
  border-radius: 10px;
  padding: 16px 3px;
  box-shadow: 0 0 18px rgba(229,194,126,.2);
  backdrop-filter: blur(3px);
}

.num {
  font-size: clamp(24px, 5.5vw, 56px);
  color: #ffe8ae;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.cap {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--gold);
  text-transform: uppercase;
}

.date-box {
  display: inline-block;
  padding: 12px 20px;
  margin: 5px 0 20px;
  border: 1px solid var(--gold);
  background: rgba(15,7,5,.8);
}

.date-text {
  margin: 0;
  color: #fff0cb;
  letter-spacing: 3px;
  font-size: 14px;
}

.wish {
  font-family: "Great Vibes", cursive;
  color: #ffe6c5;
  font-size: 30px;
  margin: 0 0 20px;
  text-shadow: 0 2px 10px #000;
}

.music-button {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 10;
  border: 1px solid var(--gold);
  border-radius: 30px;
  padding: 12px 16px;
  background: #160c08;
  color: #ffe8ae;
  font: 12px Poppins, sans-serif;
  cursor: pointer;
  box-shadow: 0 0 18px rgba(229,194,126,.3);
}

.music-button.playing {
  border-color: var(--pink);
}

@media(max-width:600px) {
  .screen { padding: 45px 10px 90px; }
  .subtitle { letter-spacing: 3px; }
  .countdown { gap: 5px; }
  .unit { padding: 12px 2px; }
  .cap { font-size: 8px; letter-spacing: 1px; }
  .date-text { font-size: 12px; letter-spacing: 2px; }
  .wish { font-size: 25px; }
}

@media(prefers-reduced-motion:reduce) {
  #petalsCanvas { display: none; }
}
</style>
</head>

<body>
<main class="screen">

  <!-- Upload your photo as bg.jpg beside index.html -->
  <img class="bg-image" src="bg.jpg" alt="Wedding background"
       onerror="this.style.display='none'; document.getElementById('imageWarning').hidden=false;">

  <canvas id="petalsCanvas" aria-hidden="true"></canvas>

  <section class="content">
    <div class="ornament">✧ ❦ ✧</div>
    <p class="subtitle">A CELEBRATION OF LOVE</p>

    <h1>Azad Ki Shadi Mubarak</h1>

    <div class="divider">
      <span></span>❦<span></span>
    </div>

    <p id="imageWarning" hidden style="color:#ffe8ae;background:#200d0d;padding:8px">
      Background image not found. Please upload bg.jpg beside index.html.
    </p>

    <p class="label" id="countdownLabel">WEDDING COUNTDOWN</p>

    <div class="minutes-total" id="totalMinutes">Loading...</div>
    <p class="minutes-caption">TOTAL MINUTES REMAINING</p>
    <p class="seconds-line" id="secondsLine">PLEASE WAIT</p>

    <div class="countdown">
      <div class="unit">
        <div class="num" id="days">--</div>
        <div class="cap">Days</div>
      </div>
      <div class="unit">
        <div class="num" id="hours">--</div>
        <div class="cap">Hours</div>
      </div>
      <div class="unit">
        <div class="num" id="minutes">--</div>
        <div class="cap">Minutes</div>
      </div>
      <div class="unit">
        <div class="num" id="seconds">--</div>
        <div class="cap">Seconds</div>
      </div>
    </div>

    <div class="date-box">
      <p class="date-text">19 OCTOBER 2026</p>
    </div>

    <p class="wish">Two Hearts, One Beautiful Journey</p>
  </section>

  <button class="music-button" id="musicButton" type="button">
    ♫ <span id="musicLabel">Start Music & Sound</span>
  </button>

</main>

<script>
(function () {
  "use strict";

  /* ===== COUNTDOWN ===== */

  const wedding = new Date(2026, 9, 19, 0, 0, 0);

  const $ = id => document.getElementById(id);

  let audioEnabled = false;
  let lastSecond = -1;
  let audioContext = null;
  let musicPlaying = false;
  let musicTimer = null;
  let melodyIndex = 0;
  let nextNoteTime = 0;

  const numberFormat = new Intl.NumberFormat("en-US");

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function updateCountdown() {
    const diff = wedding.getTime() - Date.now();

    if (diff <= 0) {
      $("totalMinutes").textContent = "0";
      $("secondsLine").textContent = "THE BIG DAY IS HERE!";
      $("countdownLabel").textContent = "HAPPY WEDDING DAY";
      $("days").textContent = "0";
      $("hours").textContent = "00";
      $("minutes").textContent = "00";
      $("seconds").textContent = "00";
      return;
    }

    const totalSec = Math.floor(diff / 1000);
    const s = totalSec % 60;

    $("totalMinutes").textContent =
      numberFormat.format(Math.floor(totalSec / 60));

    $("secondsLine").textContent = "AND " + s + " SECONDS";
    $("days").textContent = Math.floor(totalSec / 86400);
    $("hours").textContent = pad(Math.floor(totalSec % 86400 / 3600));
    $("minutes").textContent = pad(Math.floor(totalSec % 3600 / 60));
    $("seconds").textContent = pad(s);

    if (audioEnabled && s !== lastSecond) {
      playTick();
    }

    lastSecond = s;
  }

  updateCountdown();
  setInterval(updateCountdown, 200);


  /* ===== BUILT-IN TICKING SOUND ===== */

  function playTone(frequency, duration, volume, when) {
    if (!audioContext) return;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    const start = when || audioContext.currentTime;

    osc.type = "sine";
    osc.frequency.setValueAtTime(frequency, start);

    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(
      Math.max(volume, 0.0002), start + 0.008
    );
    gain.gain.exponentialRampToValueAtTime(
      0.0001, start + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start(start);
    osc.stop(start + duration + 0.02);
  }

  function playTick() {
    if (!audioEnabled || !audioContext) return;

    // Short, soft clock tick every second
    playTone(1500, 0.045, 0.055);
  }


  /* ===== ROMANTIC INSTRUMENTAL MUSIC ===== */

  // A simple melody generated locally in the browser.
  // No external MP3 link is needed.
  const melody = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    523.25, 659.25, 783.99, 1046.5,
    880.00, 783.99, 659.25, 587.33,
    523.25, 587.33, 659.25, 783.99,
    698.46, 659.25, 587.33, 523.25
  ];

  function scheduleMusic() {
    if (!audioContext || !musicPlaying) return;

    while (nextNoteTime < audioContext.currentTime + 0.5) {
      const freq = melody[melodyIndex % melody.length];

      playTone(freq, 0.48, 0.045, nextNoteTime);

      // Gentle lower accompaniment
      if (melodyIndex % 4 === 0) {
        playTone(freq / 2, 0.8, 0.018, nextNoteTime);
      }

      melodyIndex++;
      nextNoteTime += 0.48;
    }
  }

  function startMusic() {
    if (!audioContext) {
      const AudioCtx = window.AudioContext ||
                       window.webkitAudioContext;

      if (!AudioCtx) {
        $("musicLabel").textContent = "Audio not supported";
        return;
      }

      audioContext = new AudioCtx();
    }

    audioContext.resume().then(function () {
      audioEnabled = true;
      musicPlaying = true;
      nextNoteTime = audioContext.currentTime + 0.05;

      if (musicTimer) clearInterval(musicTimer);
      musicTimer = setInterval(scheduleMusic, 100);

      scheduleMusic();

      $("musicLabel").textContent = "Pause Music";
      $("musicButton").classList.add("playing");
    }).catch(function () {
      $("musicLabel").textContent = "Tap to Try Again";
    });
  }

  function stopMusic() {
    musicPlaying = false;

    if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }

    $("musicLabel").textContent = "Play Music";
    $("musicButton").classList.remove("playing");
  }

  $("musicButton").addEventListener("click", function () {
    if (musicPlaying) {
      stopMusic();
    } else {
      startMusic();
    }
  });


  /* ===== FALLING ROSE PETALS ===== */

  const canvas = $("petalsCanvas");
  const ctx = canvas.getContext("2d");
  const screen = document.querySelector(".screen");

  let width = 0;
  let height = 0;
  let petals = [];
  let animationFrame = null;

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  function newPetal(randomY) {
    return {
      x: Math.random() * Math.max(width, 1),
      y: randomY ? Math.random() * Math.max(height, 1)
                 : -20 - Math.random() * 60,
      size: 5 + Math.random() * 8,
      speed: 0.8 + Math.random() * 1.5,
      drift: (Math.random() - 0.5) * 0.8,
      angle: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 0.045,
      sway: Math.random() * 6.28,
      swaySpeed: 0.015 + Math.random() * 0.02,
      color: Math.random() > 0.8
        ? "#e5c27e"
        : (Math.random() > 0.5 ? "#ffc0d7" : "#d75b86"),
      alpha: 0.65 + Math.random() * 0.3
    };
  }

  function resizeCanvas() {
    const rect = screen.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    width = rect.width;
    height = rect.height;

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(
      70, Math.max(30, Math.floor(width / 8))
    );

    petals = Array.from(
      { length: count },
      () => newPetal(true)
    );
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;

    ctx.beginPath();
    ctx.moveTo(0, -p.size);
    ctx.bezierCurveTo(
      p.size, -p.size * 0.6,
      p.size, p.size * 0.6,
      0, p.size
    );
    ctx.bezierCurveTo(
      -p.size, p.size * 0.6,
      -p.size, -p.size * 0.6,
      0, -p.size
    );
    ctx.fill();
    ctx.restore();
  }

  function animatePetals() {
    animationFrame = null;

    if (document.hidden || reducedMotion) return;

    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];

      p.sway += p.swaySpeed;
      p.x += p.drift + Math.sin(p.sway) * 0.7;
      p.y += p.speed;
      p.angle += p.spin;

      drawPetal(p);

      if (p.y > height + 20) {
        petals[i] = newPetal(false);
      }
    }

    animationFrame = requestAnimationFrame(animatePetals);
  }

  function startPetals() {
    if (!reducedMotion && !document.hidden &&
        animationFrame === null) {
      animationFrame = requestAnimationFrame(animatePetals);
    }
  }

  function stopPetals() {
    if (animationFrame !== null) {
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
  }

  resizeCanvas();
  startPetals();

  window.addEventListener("resize", function () {
    resizeCanvas();
    startPetals();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      stopPetals();
    } else {
      startPetals();
    }
  });

})();
</script>
</body>
</html>
