<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A New Chapter of Forever</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    color: #fff4dc;
    background:
        linear-gradient(rgba(20, 5, 15, 0.52), rgba(20, 5, 15, 0.72)),
        url("bg.jpg") center center / cover no-repeat fixed;
}

#petals {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
}

.card {
    width: min(100%, 750px);
    padding: 42px 24px;
    border: 1px solid rgba(255, 220, 160, 0.75);
    border-radius: 22px;
    background: rgba(28, 8, 22, 0.38);
    box-shadow: 0 0 35px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(3px);
}

.eyebrow {
    color: #f3ce8b;
    letter-spacing: 5px;
    font-size: 13px;
    margin-bottom: 22px;
}

h1 {
    font-size: clamp(35px, 7vw, 66px);
    line-height: 1.12;
    font-weight: normal;
    color: #ffe7b0;
    text-shadow: 0 3px 18px rgba(0, 0, 0, 0.7);
}

.subtitle {
    margin-top: 20px;
    font-family: Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 6px;
    color: #fff0d0;
}

.divider {
    width: 100px;
    height: 1px;
    background: #e8bd77;
    margin: 28px auto;
}

.countdown-label {
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #f3ce8b;
    margin-bottom: 12px;
}

#minutes {
    font-size: clamp(42px, 9vw, 76px);
    color: #fff0c9;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 20px rgba(255, 202, 120, 0.25);
}

#seconds {
    margin-top: 8px;
    font-family: Arial, sans-serif;
    font-size: 16px;
    letter-spacing: 2px;
    color: #f7dcb1;
}

.date {
    margin-top: 24px;
    font-size: 17px;
    color: #ffe4b1;
    letter-spacing: 2px;
}

.message {
    margin-top: 20px;
    font-size: 15px;
    font-style: italic;
    color: #f8e6d3;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 28px;
}

button {
    border: 1px solid #e8bd77;
    background: rgba(40, 10, 25, 0.7);
    color: #ffe7b0;
    padding: 12px 18px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 13px;
    letter-spacing: 1px;
    transition: 0.25s;
}

button:hover {
    background: #e8bd77;
    color: #301020;
}

@media (max-width: 480px) {
    .card {
        padding: 34px 16px;
    }

    .eyebrow {
        letter-spacing: 3px;
    }

    .subtitle {
        letter-spacing: 4px;
    }
}
</style>
</head>

<body>
<canvas id="petals"></canvas>

<main class="container">
    <section class="card">
        <div class="eyebrow">✨ A BEAUTIFUL BEGINNING ✨</div>

        <h1>A New Chapter<br>of Forever</h1>

        <div class="subtitle">WEDDING COUNTDOWN</div>

        <div class="divider"></div>

        <div class="countdown-label">MINUTES REMAINING</div>
        <div id="minutes">Calculating...</div>
        <div id="seconds">Until the big day</div>

        <div class="date">19 OCTOBER 2026</div>

        <p class="message">
            Two hearts, one beautiful journey, forever together.
        </p>

        <div class="controls">
            <button id="musicButton">♫ Play Music</button>
            <button id="tickButton">♪ Enable Ticking</button>
        </div>
    </section>
</main>

<script>
// WEDDING COUNTDOWN
const wedding = new Date(2026, 9, 19);

function updateCountdown() {
    const now = new Date();
    const difference = wedding.getTime() - now.getTime();

    if (difference <= 0) {
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent =
            "The big day is here! ❤️";
        return;
    }

    const totalMinutes = Math.floor(difference / 60000);
    const seconds = Math.floor((difference % 60000) / 1000);

    document.getElementById("minutes").textContent =
        totalMinutes.toLocaleString("en-US");

    document.getElementById("seconds").textContent =
        "＋ " + String(seconds).padStart(2, "0") +
        " seconds to the next minute";
}

updateCountdown();
setInterval(updateCountdown, 1000);


// AUDIO: TICKING SOUND AND SOFT MELODY
let audioContext;
let musicTimer;
let musicOn = false;
let tickingOn = false;
let nextNoteTime = 0;
let noteIndex = 0;

function setupAudio() {
    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
            alert("Audio is not supported by this browser.");
            return false;
        }

        audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return true;
}

function playTone(frequency, duration, volume, type = "sine") {
    if (!audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;
    gain.gain.setValueAtTime(volume, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
}

// Gentle ticking, once each second
setInterval(() => {
    if (tickingOn && setupAudio()) {
        playTone(1100, 0.045, 0.035, "square");
    }
}, 1000);

document.getElementById("tickButton").addEventListener("click", () => {
    if (!setupAudio()) return;

    tickingOn = !tickingOn;
    document.getElementById("tickButton").textContent =
        tickingOn ? "♪ Disable Ticking" : "♪ Enable Ticking";
});

// Soft, generated instrumental-style melody
const melody = [
    523.25, 659.25, 783.99, 659.25,
    587.33, 698.46, 880.00, 698.46,
    523.25, 659.25, 783.99, 1046.50,
    880.00, 783.99, 659.25, 587.33
];

function playNextNote() {
    if (!musicOn || !audioContext) return;

    const frequency = melody[noteIndex % melody.length];
    playTone(frequency, 0.65, 0.055, "sine");
    noteIndex++;
}

document.getElementById("musicButton").addEventListener("click", () => {
    if (!setupAudio()) return;

    musicOn = !musicOn;

    if (musicOn) {
        playNextNote();
        musicTimer = setInterval(playNextNote, 700);
        document.getElementById("musicButton").textContent = "♫ Pause Music";
    } else {
        clearInterval(musicTimer);
        document.getElementById("musicButton").textContent = "♫ Play Music";
    }
});


// FALLING ROSE PETALS
const canvas = document.getElementById("petals");
const ctx = canvas.getContext("2d");

let width, height, petals = [];

function resizeCanvas() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    createPetals();
}

function createPetals() {
    petals = [];

    for (let i = 0; i < 38; i++) {
        petals.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: 5 + Math.random() * 8,
            speed: 0.6 + Math.random() * 1.5,
            drift: Math.random() * 1.4 - 0.7,
            rotation: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.035,
            opacity: 0.45 + Math.random() * 0.45
        });
    }
}

function drawPetals() {
    ctx.clearRect(0, 0, width, height);

    petals.forEach(p => {
        p.y += p.speed;
        p.x += p.drift;
        p.rotation += p.spin;

        if (p.y > height + 20) {
            p.y = -20;
            p.x = Math.random() * width;
        }

        if (p.x < -20) p.x = width + 20;
        if (p.x > width + 20) p.x = -20;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = "#e9a0b7";

        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 0.55, p.size, 0, 0,
                    Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    requestAnimationFrame(drawPetals);
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();
drawPetals();
</script>
</body>
</html>
