<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azad Wedding Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:#000;color:#fff;font-family:'Poppins',sans-serif;text-align:center}
.box{padding:20px}
h2{font-family:'Great Vibes',cursive;font-size:48px;color:#ff8fab;margin:0}
h3{letter-spacing:8px;color:#c9a96e;font-size:14px;margin:10px 0 30px 0}
#timer{font-size:85px;font-weight:700;background:linear-gradient(#fff,#c9a96e);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#label{letter-spacing:5px;color:#888;font-size:12px;margin-top:10px}
.date{border:1px solid #c9a96e;padding:10px 30px;display:inline-block;margin-top:30px;color:#c9a96e;letter-spacing:3px}
</style>
</head>
<body>
<div class="box">
<div style="font-size:28px">❤️</div>
<h2>Azad Ki Shadi Mubarak</h2>
<h3>WEDDING COUNTDOWN</h3>
<div id="timer">0</div>
<div id="label">MINUTES REMAINING</div>
<div class="date">19 OCTOBER 2026</div>
</div>
<script>
const wedding = new Date(2026,9,19);
function update(){
  const diff = wedding - new Date();
  const mins = Math.floor(diff/1000/60);
  document.getElementById('timer').innerText = mins>0 ? mins.toLocaleString() : "Shadi Mubarak!";
}
setInterval(update,1000);update();
</script>
</body>
</html>
